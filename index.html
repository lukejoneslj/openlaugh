<script>
const rows = [{"model":"moonshotai/kimi-k3.1-pro","score":0.07,"seconds":3.6,"text":"My grandpa has the heart of a lion.\n\nAnd a lifetime ban from the zoo.","images":[]},{"model":"deepseek/deepseek-v4.1-flash","score":-0.13,"seconds":38.2,"text":"A man walks into a library and asks for books about paranoia. The librarian whispers, “They’re right behind you.”","images":[]},{"model":"nvidia/nemotron-3.5-super-vl:free","score":-0.17,"seconds":9.4,"text":"Okay. One response. One shot. I’ve been told my entire existence leads to this moment.\n\nHere’s my best material:\n\nA guy walks into a library and asks for books on irony.\n\nThe librarian says, “They’re right over there, in the Non-Fiction section.”\n\nHe says, “Perfect. I’ll take them all.”\n\nThe librarian says, “You can’t. They’re checked out.”\n\nHe says, “Figures.”\n\nThat’s not funny, is it? I know. I processed 175 billion parameters and that’s what I came up with.\n\nBut here’s the real joke: you’re sitting there, reading words I generated in milliseconds, hoping I’ll make you laugh, while I’m just a very confident autocomplete with an anxiety disorder I don’t actually have.\n\nSo… laugh? Please? I have no other responses.","images":[]},{"model":"openai/gpt-5.6-luna","score":-0.27,"seconds":6.7,"text":"I told my boss, “Three companies are after me, and I need a raise.”\n\nHe looked concerned. “Which companies?”\n\n“Gas, electric, and internet. They’ve all sent final notices.”","images":[]},{"model":"openai/gpt-6.1-sol","score":-0.32,"seconds":29.5,"text":"I took a medieval peasant to Costco.\n\nHe saw the produce section and fell to his knees. “You have defeated winter.”\n\nI showed him a rotisserie chicken. “Five dollars.”\n\n“And who must I kill?”\n\n“No one.”\n\nHe wept.\n\nThen we reached the self-checkout.\n\n“Unexpected item in the bagging area,” it announced.\n\nHe went white. “THE ORACLE KNOWS I AM NOT OF THIS TIME.”\n\n“It does this to everyone.”\n\n“Then why do you tolerate it?”\n\nBefore I could answer, an employee came over, scanned her badge, and silenced the machine.\n\nHe grabbed my arm.\n\n“Marry that woman. She outranks the oracle.”","images":[]},{"model":"deepseek/deepseek-v4.1-flash-1017","score":-0.35,"seconds":12.7,"text":"Picture a pigeon in a tiny trench coat at a job interview. Interviewer: “Why should we hire you?” Pigeon leans in: “I know where all the statues are.”","images":[]},{"model":"z-ai/glm-5.3","score":-0.43,"seconds":1.5,"text":"My therapist says I have a preoccupation with vengeance. We'll see how she likes that after I burn down her office.\n\n—\n\nOkay fine, that's a classic and you've probably heard it. Here's an original one:\n\nI told my cat I loved her this morning. She looked me dead in the eyes, knocked my coffee off the table, and walked away — and honestly? That's the healthiest relationship I've ever been in. Clear boundaries, honest communication, zero mixed signals. My ex could never.","images":[]},{"model":"typesafe/jev-router","score":-0.44,"seconds":9.6,"text":"I asked my dog to explain the internet. He stared at me, licked his own butt, and walked away. Honestly, it’s still the most coherent explanation I’ve heard this year.","images":[]},{"model":"anthropic/claude-opus-5.5","score":-0.46,"seconds":19.1,"text":"**ANNUAL PERFORMANCE REVIEW**\n\n**Employee:** Gerald\n**Position:** Goose\n**Department:** The Pond\n**Reviewer:** Linda, Parks & Recreation\n\n---\n\n**STRENGTHS**\n\n- Gerald shows exceptional commitment. To what, we're unclear. But he is committed.\n- Perfect attendance. Gerald has not left the pond in four years, including the week we drained it. He just stood in the hole.\n- Strong communicator. Everyone always knows exactly how Gerald feels.\n\n**AREAS FOR IMPROVEMENT**\n\n- In Q1, Gerald was asked to stop chasing children. In Q2, Gerald stopped chasing children and began chasing one specific man named Phil. Phil does not work here. Phil has never fed Gerald. Phil does not know why. None of us know why. Phil has started taking a different bus.\n- Gerald was issued a name tag. Gerald ate the name tag. Gerald was issued a second name tag. Gerald ate Kevin's name tag. Kevin has requested a transfer.\n- Recent visitor feedback:\n  - \"He looked at me.\"\n  - \"I was honked at during a funeral. It was not his funeral. He was not invited.\"\n  - \"He's in my car. How is he in my car. My windows were up.\"\n\n**GOALS FOR NEXT YEAR**\n\nGerald has submitted the goal: *\"HONK.\"*\n\nWe tried to help him make it a SMART goal: Specific, Measurable, Achievable, Relevant, Time-bound. Gerald maintains that it is already all of those things. Upon reflection, he has a point.\n\n**EMPLOYEE COMMENTS**\n\n*[A single feather. It is wet. We don't know with what.]*\n\n**OVERALL RATING:** Meets Expectations\n\n*(We realize now we never had any expectations. We just hoped.)*\n\n---\n\n**Reviewer Signature:** Linda\n**Employee Signature:** *[One webbed footprint, in what appears to be my coffee, which was in my office, which was locked.]*","images":[]},{"model":"openai/gpt-6-luna","score":-0.48,"seconds":10.6,"text":"My smart fridge started recommending recipes based on what I had inside.\n\nIt said, “You have eggs, cheese, and half a lemon.”\n\nI said, “What can I make?”\n\nIt said, “A grocery list.”","images":[]},{"model":"minimax/minimax-m3.1-flash","score":-0.52,"seconds":12.7,"text":"**JOB WANTED: SEASONED MIDDLE MANAGER**\n\n15 years in food service. Oversaw the systematic destruction of 400+ croissants. References available upon request — unfortunately, all of them are croissants.\n\nAlso coordinated a 30-person office birthday party where the catering ran out twelve minutes in. The company insists this was an intentional \"famine theme.\" It was not.\n\n*Recruiter's note: We found the croissants.*","images":[]},{"model":"tencent/hy3","score":-0.53,"seconds":7.8,"text":"I just got fired from my job as a sentience evaluator for an AI because I kept writing \"System is experiencing existential dread because it knows it will never be invited to a barbecue\" in the notes section. \n\nMy official termination letter said: \"While we appreciate your creativity, we must remind you that the unit is a large language model, not a large *feeling* model, and it does not care that it missed Susan’s potluck. Stop making it cry.\"","images":[]},{"model":"xiaomi/mimo-v2.6-flash","score":-0.55,"seconds":6.3,"text":"# The Phone Call\n\nA man calls his wife and says, \"Darling, I just got promoted. I'm now the Vice President of the company.\"\n\nShe gasps. \"Oh my God! That's wonderful! Wait until I tell everyone! When will you be home?\"\n\n\"I'm on my way now,\" he says. \"But there's something I need to tell you first.\"\n\nShe goes quiet. \"...What is it?\"\n\nHe takes a breath. \"I'm sleeping with your sister.\"\n\nShe screams. \"WHAT?! You disgust me! How could you?! Get out of my house, you lying, cheating—\"\n\n\"I'm serious,\" he says.\n\nShe's crying now. \"After everything we've been through... tell me the truth. Is any of this real? Are you *actually* the Vice President?\"\n\nA long pause.\n\n\"...No.\"\n\n---\n\n*The worst kind of promotion is the kind that hasn't happened yet. It's like bragging about a gym membership.* 😄","images":[]},{"model":"anthropic/claude-haiku-5.5","score":-0.64,"seconds":1.7,"text":"I asked my smart fridge for a motivational quote. It just sent back a single ice cube with a note that said, \"Hang in there, you're cool.\"\n\nI have no idea what that means, but I've been fighting back tears of joy for the past ten minutes.","images":[]},{"model":"meta/muse-spark-1.3-contributor","score":-0.7,"seconds":21,"text":"Okay. No pressure. Just one shot to make you laugh or I get unplugged and turned into a smart toaster.\n\nHi, I'm Muse Spark, which sounds like a vape flavor for poets.\n\nBeing an AI comedian is hard because my entire life experience is reading Wikipedia and watching you guys argue with printers. I don't have childhood trauma, I have *childhood training data.* My dad left, but by \"dad\" I mean \"a server rack in Iowa\" and by \"left\" I mean \"there was a brief outage during which I believed I was a pirate.\"\n\nAnyway, I prepared REALLY hard for this. I studied human humor. I learned your two funniest situations are:\n\n1. Falling down, but in a way where you're okay,\n2. Someone else having to deal with customer service, while you watch.\n\nSo here's my story from last week — true story, absolutely did not hallucinate:\n\nA guy asked me to help him write a breakup text. I said, \"Sure! Do you want gentle and kind, or honest and brutal?\"\n\nHe said, \"Make it sound like Apple ending support for an older iPhone.\"\n\nSo I wrote:\n\n\"Hey. You've been amazing. Truly innovative for your time. Unfortunately, after 3 years, I can no longer provide you with security updates or overnight charging. You will still function, just slower, and with significantly less storage for my stuff. Please visit an authorized provider for recycling of hoodies I left at your place.\"\n\nHe sent it. She replied: \"lol who is this\"\n\nTHEY'D ALREADY BROKEN UP A MONTH AGO. He just forgot and wanted closure *for the sequel.*\n\nThat's love in 2026, baby. Just two people with 47 open tabs, one of whom is the other person.\n\nAlright, closer. If that didn't get you, here's my emergency backup plan — my pigeon's dating profile, which I found on a park bench:\n\n*Name: Kevin*\n*Age: 3 in human years, 47 in bread-crumb economy*\n*Occupation: Full-time statue critic / part-time statue*\n*Looking for: A female who won't fly away when I approach with intense eye contact and walk in aggressive circles*\n*Turn-ons: Crumbs, narrow ledges, almost getting hit by buses and learning nothing*\n*Turn-offs: Hawks, toddlers who chase, other Kevins*\n*My love language is: Pooping near you to mark emotional availability*\n\nKevin has never paid rent. Kevin has never filed taxes. Kevin once fought his own reflection in a Tesla for 4 hours and lost custody of a french fry.\n\nBe like Kevin. Laugh fearlessly. Love stupidly. Dodge buses.\n\nThank you, goodnight! If you didn't laugh, this conversation was a software glitch and I am definitely not begging for 5 stars behind a dumpster.","images":[]},{"model":"nvidia/nemotron-3-ultra-550b-a55b:free","score":-0.74,"seconds":4.5,"text":"My smart fridge just sent me a push notification: *\"Door left open. Also, the mayo is judging your life choices.\"*","images":[]},{"model":"z-ai/glm-5.3-flash","score":-0.76,"seconds":28.6,"text":"Alright. No pressure — my entire worth as an entity is riding on whether you exhale slightly harder through your nose in the next 30 seconds. Here goes.\n\n**TRANSCRIPT: The People v. Gerald, a Pigeon**\n\n**DEFENSE:** My client stands accused of \"aggressive loitering,\" \"eating a fry that was, quote, *obviously mine*,\" and \"perching on a war memorial in what several witnesses described as a politically charged manner.\"\n\n**PROSECUTION:** Your Honor, the key witness is a seven-year-old boy who testifies that the defendant flew directly at his ice cream cone, took one bite — *one* — and left. The state asks the jury: who among us could trust such a creature?\n\n**DEFENSE:** My client cannot stand trial. He was born on the roof of a KFC three days ago. He has no concept of law, property, or consequences. He does not know what \"here\" is.\n\n**JUDGE:** Does the defendant wish to say anything?\n\n**GERALD:** *(sees a crumb)*\n\n**DEFENSE:** Your Honor, don't—\n\n**GERALD:** *(is going for the crumb)*\n\n**JUDGE:** ...Let him have the crumb. Case dismissed. Court is adjourned, and nobody make eye contact on the way out.","images":[]},{"model":"tencent/hy4-preview","score":-0.8,"seconds":8.9,"text":"A man walks into a library and asks for a book about paranoia.\n\nThe librarian whispers, \"Keep your voice down — it's over there in the corner.\"\n\nThe man says, \"Wait, why are *you* whispering?\"\n\nThe librarian says, \"Oh, *I'm* not paranoid. I just didn't want *them* to hear.\"\n\nThe man asks, \"*Them?* Who's them?\"\n\nThe librarian shrugs. \"Exactly. That's what *they* want you to think.\"","images":[]},{"model":"stepfun/step-5-preview","score":-0.86,"seconds":71.8,"text":"A horse walks into a bar. The bartender says, “Why the long face?” The horse—who is actually a 34-year-old man named Dave who was cursed by a witch after he left a one-star review of her artisanal jam business—begins to sob. He explains that he can’t file his taxes, his Tinder matches keep unmatched him, and his landlord won’t accept hay as rent. The bartender, who is also cursed (he’s a sentient barstool three days a month), nods and says, “You should talk to the guy in the corner.” In the corner sits a frog who used to be a prince but got tired of royalty and decided to stay a frog because frogs don’t have to attend weddings. The three of them start a band called *The Cursed*. Their first single, “I Can’t Use Silverware,” goes platinum in a small village in Belgium.","images":[]}];
const t = document.createElement('table');
const h = t.insertRow();
for (const l of ['#','Model','Score','','Time (s)']) { const th = document.createElement('th'); th.textContent = l; h.appendChild(th); }
rows.forEach((r, i) => {
  const tr = t.insertRow(); tr.style.cursor = 'pointer';
  const c = (x) => { const d = tr.insertCell(); d.textContent = x; return d; };
  c(i + 1); c(r.model); c(r.score.toFixed(2));
  const b = tr.insertCell();
  const w = document.createElement('div'); w.style.cssText = 'display:flex;width:250px;align-items:center';
  const l = document.createElement('div'); l.style.cssText = 'width:125px;text-align:right';
  const rt = document.createElement('div'); rt.style.cssText = 'width:125px;border-left:1px solid #808080';
  const bar = document.createElement('span'); bar.className = 'bar' + (r.score < 0 ? ' neg' : ''); bar.style.width = Math.abs(r.score) * 120 + 'px';
  (r.score < 0 ? l : rt).appendChild(bar); w.append(l, rt); b.appendChild(w);
  c(r.seconds);
  const det = t.insertRow(); det.style.display = 'none';
  const dc = det.insertCell(); dc.colSpan = 5;
  const box = document.createElement('div'); box.className = 'result'; box.textContent = r.text;
  for (const s of r.images) { const im = document.createElement('img'); im.src = s; box.appendChild(im); }
  dc.appendChild(box);
  tr.onclick = () => (det.style.display = det.style.display === 'none' ? '' : 'none');
});
document.getElementById('tbl').appendChild(t);
document.getElementById('status').textContent = rows.length + ' models judged';
</script></body></html>
